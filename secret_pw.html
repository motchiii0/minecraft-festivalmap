  <meta charset="UTF-8">
  <title>秘密のページ</title>
  <link rel="stylesheet" href="secret_pw.css">
</head>

<body>

  <div class="container">
    <h2>パスワードを入力してください</h2>

    <input type="password" id="pw" placeholder="パスワード">
    <button onclick="checkPassword()">送信</button>

    <div id="message" class="error"></div>
  </div>

  <script>
    function checkPassword() {
      const correctPassword = "password"; 
      const input = document.getElementById("pw").value;

      if (input === correctPassword) {
        window.location.href = "secret_page.html";
      } else {
        document.getElementById("message").textContent = "パスワードが違います";
      }
    }
  </script>

</body>
